<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lidera tu Vida · Plan de Crecimiento Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101B2C;
    --ink-soft:#4C5A70;
    --paper:#F3F5F9;
    --paper-raised:#FFFFFF;
    --line:#D9E0EA;
    --navy-deep:#070D18;
    --navy:#0F2750;
    --gold:#E0AF3B;
    --gold-deep:#B98A24;
    --clay:#B5573F;
    --sage:#2E7D5B;
    --amber:#E0AF3B;
    --red:#B23B32;
    --green:#2E7D5B;
    --shadow: 0 1px 2px rgba(7,13,24,.06), 0 8px 24px -12px rgba(7,13,24,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold); color:var(--paper-raised);}
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:.02em;}
  a{color:inherit;}
  button{font-family:inherit;}
  #app{max-width:960px; margin:0 auto; padding:22px 20px 80px;}

  .brandbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px calc(50vw - 50%); margin:-22px calc(-50vw + 50%) 26px;
    background:var(--navy-deep);
    background-image: radial-gradient(ellipse at 15% -40%, rgba(224,175,59,.10), transparent 55%);
  }
  .brandbar.auth-variant{ margin:0 auto; padding:0 0 16px; background:none; }
  .brandmark{display:flex; align-items:center; gap:12px;}
  .brandmark img.logomark{ height:38px; width:auto; display:block; }
  .whoami{font-size:13px; color:#C7D0DE; text-align:right;}
  .whoami b{color:var(--paper-raised); font-weight:600;}
  .logoutlink{font-size:12px; text-decoration:underline; color:#9FADC2; cursor:pointer; background:none; border:none; padding:0; margin-top:3px;}
  .logoutlink:hover{color:var(--gold);}

  nav.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:26px;}
  nav.tabs button{
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    padding:8px 14px; border-radius:100px; font-size:13px; font-weight:600; cursor:pointer;
    transition:all .15s ease;
  }
  nav.tabs button:hover{border-color:var(--gold-deep); color:var(--ink);}
  nav.tabs button.active{background:var(--navy); color:var(--paper-raised); border-color:var(--navy);}
  nav.tabs button.mentorbtn{border-style:dashed;}

  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    padding:24px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .card + .card{margin-top:18px;}
  .card h2{font-size:22px; margin-bottom:4px;}
  .card .lede{color:var(--ink-soft); font-size:14px; margin-bottom:18px; max-width:60ch; line-height:1.5;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}
  label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  input[type=text], input[type=password], input[type=number], textarea, select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); font-family:'Public Sans', sans-serif; font-size:14.5px; color:var(--ink);
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}
  .field{margin-bottom:14px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:9px; border:none;
    background:var(--navy); color:var(--paper-raised); font-weight:700; font-size:14px; cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:var(--gold-deep);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent; color:var(--navy); border:1.5px solid var(--navy);}
  .btn.secondary:hover{background:var(--navy); color:var(--paper-raised);}
  .btn.small{padding:7px 13px; font-size:12.5px; border-radius:7px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .semadot{width:11px; height:11px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .semadot.rojo{background:var(--red); box-shadow:0 0 0 3px rgba(178,59,50,.15);}
  .semadot.amarillo{background:var(--amber); box-shadow:0 0 0 3px rgba(217,164,65,.18);}
  .semadot.verde{background:var(--green); box-shadow:0 0 0 3px rgba(63,122,74,.18);}
  .semarow{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); font-weight:600;}

  .arealist{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:760px){.arealist{grid-template-columns:1fr 1fr;}}
  .areacard{
    border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--paper);
    cursor:pointer; transition:border-color .15s ease, transform .1s ease;
  }
  .areacard:hover{border-color:var(--gold-deep); transform:translateY(-2px);}
  .areacard .icon{font-size:20px; margin-bottom:6px; display:block;}
  .areacard .label{font-weight:700; font-size:14px; margin-bottom:8px;}
  .areacard .metapreview{font-size:12px; color:var(--ink-soft); line-height:1.4; min-height:32px;}

  .stemwrap{display:flex; justify-content:center; padding:6px 0 4px;}
  .steps-legend{display:flex; justify-content:space-between; margin-top:2px; font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  ul.plain{list-style:none; margin:0; padding:0;}
  .rowitem{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .rowitem:last-child{border-bottom:none;}
  .rowitem .meta{color:var(--ink-soft); font-size:11.5px; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .tagpill{
    display:inline-block; padding:2px 9px; border-radius:100px; font-size:11px; font-weight:700;
    background:rgba(46,125,91,.12); color:var(--sage); margin-right:6px; text-transform:capitalize;
  }
  .foda-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){.foda-grid{grid-template-columns:1fr;}}
  .foda-box{border-radius:12px; padding:15px; border:1px solid var(--line);}
  .foda-box.f{background:rgba(46,125,91,.08);}
  .foda-box.d{background:rgba(178,59,50,.08);}
  .foda-box.o{background:rgba(224,175,59,.12);}
  .foda-box.a{background:rgba(16,27,44,.06);}
  .foda-box h3{font-size:14px; margin-bottom:8px;}
  .chiprow{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:100px; padding:4px 10px 4px 12px;
    font-size:12.5px; display:flex; align-items:center; gap:6px;
  }
  .chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .chip button:hover{color:var(--red);}
  .estado-btn{
    border:none; border-radius:100px; padding:2px 8px; font-size:10.5px; font-weight:700; cursor:pointer;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .estado-btn.activa{background:rgba(178,59,50,.14); color:var(--red);}
  .estado-btn.en_progreso{background:rgba(224,175,59,.20); color:var(--gold-deep);}
  .estado-btn.superada{background:rgba(46,125,91,.16); color:var(--sage);}
  .inlineadd{display:flex; gap:6px; margin-top:8px;}
  .inlineadd input{flex:1;}

  .progressbar{height:8px; border-radius:100px; background:var(--line); overflow:hidden; margin-top:8px;}
  .progressbar > div{height:100%; background:var(--sage); border-radius:100px; transition:width .3s ease;}

  .authwrap{max-width:420px; margin:6vh auto 0;}
  .toggler{display:flex; gap:0; margin-bottom:20px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .toggler button{flex:1; padding:10px; background:var(--paper-raised); border:none; font-weight:700; font-size:13px; cursor:pointer; color:var(--ink-soft);}
  .toggler button.active{background:var(--navy); color:var(--paper-raised);}
  .noteline{font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin-top:14px; padding:10px 12px; background:rgba(224,175,59,.09); border-radius:8px; border:1px dashed var(--gold-deep);}
  .errbox{color:var(--red); font-size:13px; margin-top:8px; font-weight:600;}
  .okbox{color:var(--sage); font-size:13px; margin-top:8px; font-weight:600;}

  .quote{font-family:'Fraunces', serif; font-style:italic; font-size:17px; color:var(--ink-soft); border-left:3px solid var(--gold); padding-left:16px; margin:6px 0 20px; line-height:1.5;}

  table.mentortable{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.mentortable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:2px solid var(--navy); padding:8px 6px;}
  table.mentortable td{padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.mentortable tr:hover td{background:rgba(224,175,59,.07); cursor:pointer;}
  .semacell{display:flex; gap:5px;}

  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13.5px;}
  .empty .big{font-size:26px; display:block; margin-bottom:6px;}

  .steprow{display:flex; gap:12px; margin-bottom:16px;}
  .footerbar{text-align:center; margin-top:36px; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .loadingscreen{text-align:center; padding:60px 10px; color:var(--ink-soft);}
</style>
</head>

/* ============================= CLIENTE DE API ============================= */
const API_BASE = ''; // mismo origen; cámbialo si sirves el frontend aparte de la API
const TOKEN_KEY = 'ltv_token';
const USER_KEY = 'ltv_user';

function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setSession(token, user){
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(USER_KEY, JSON.stringify(user));
}
function clearSession(){
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
}
function getStoredUser(){
  try{ return JSON.parse(localStorage.getItem(USER_KEY)); }catch(e){ return null; }
}

async function api(path, { method='GET', body } = {}){
  const headers = { 'Content-Type': 'application/json' };
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + '/api' + path, {
    method, headers, body: body !== undefined ? JSON.stringify(body) : undefined
  });
  let payload = null;
  try{ payload = await res.json(); }catch(e){ /* respuesta sin cuerpo */ }
  // Un 401 solo significa "tu sesión expiró" si HABÍA un token guardado y lo
  // mandamos (es decir, esta llamada iba autenticada). Si no había token
  // (por ejemplo, un intento de login con clave incorrecta), es un error
  // normal con su propio mensaje, no un cierre de sesión.
  if(res.status === 401 && token){
    clearSession();
    STATE.session = null; STATE.userData = null;
    setView('auth', { authMode:'login', err:'Tu sesión expiró. Inicia sesión de nuevo.' });
    throw new Error('SESSION_EXPIRED');
  }
  if(!res.ok){
    throw new Error((payload && payload.error) || 'Ocurrió un error inesperado.');
  }
  return payload;
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function stemSVG(completed){
  const total = 6;
  const H = 210, W = 420;
  const baseY = H-14, topY = 26;
  let nodes = '';
  let leafPaths = '';
  for(let i=0;i<total;i++){
    const t = i/(total-1);
    const y = baseY - t*(baseY-topY);
    const x = W/2 + Math.sin(i*1.15)*26;
    const done = i < completed;
    nodes += `<circle cx="${x}" cy="${y}" r="${done?9:6}" fill="${done?'var(--sage)':'var(--paper)'}" stroke="${done?'var(--sage)':'var(--line)'}" stroke-width="2"/>`;
    if(done){
      const dir = i%2===0?1:-1;
      leafPaths += `<path d="M ${x} ${y} Q ${x+dir*30} ${y-16} ${x+dir*6} ${y-34}" stroke="var(--sage)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>`;
    }
  }
  let stem = `M ${W/2} ${baseY}`;
  for(let i=1;i<total;i++){
    const t=i/(total-1); const y = baseY - t*(baseY-topY); const x = W/2 + Math.sin(i*1.15)*26;
    stem += ` L ${x} ${y}`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="max-width:440px">
    <path d="${stem}" stroke="var(--ink-soft)" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${leafPaths}
    ${nodes}
  </svg>`;
}

let hayMentorConocido = null;
async function ensureEstadoAuth(){
  if(hayMentorConocido !== null) return;
  try{
    const res = await fetch(API_BASE + '/api/auth/estado');
    const data = await res.json();
    hayMentorConocido = !!data.hayMentor;

function attachAuthEvents(){
  const loginBtn = document.getElementById('btn-login');
  if(loginBtn) loginBtn.addEventListener('click', doLogin);
  const regBtn = document.getElementById('btn-register');
  if(regBtn) regBtn.addEventListener('click', doRegister);
}

async function doRegister(){
  const nombre = document.getElementById('reg-nombre').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pin').value;
  try{
    const { token, user } = await api('/auth/register', { method:'POST', body:{ nombre, email, username, password } });
    setSession(token, user);
    await enterApp(user);
  }catch(e){ STATE.err = e.message; render(); }
}

async function doLogin(){
  const username = document.getElementById('in-user').value.trim().toLowerCase();
  const password = document.getElementById('in-pin').value;
  if(!username || !password){ STATE.err='Ingresa tu usuario y tu clave.'; render(); return; }
  try{
    const { token, user } = await api('/auth/login', { method:'POST', body:{ username, password } });
    setSession(token, user);
    await enterApp(user);
  }catch(e){ STATE.err = e.message; render(); }
}

async function enterApp(user){
  STATE.session = user;
  const res = await api('/data');
  STATE.userData = res.data;
  setView('dashboard');
}

function attachGlobalEvents(){
  document.querySelectorAll('nav.tabs [data-v]').forEach(b=>b.addEventListener('click', ()=>{
    STATE.areaOpen=null; STATE.mentorSelected=null; setView(b.dataset.v);
  }));
  const lo = document.getElementById('btn-logout');
  if(lo) lo.addEventListener('click', ()=>{
    clearSession();
    STATE.session=null; STATE.userData=null; STATE.mentorList=null;
    setView('auth', {authMode:'login'});
  });
  const dl = document.getElementById('btn-download-pdf');
  if(dl) dl.addEventListener('click', ()=>downloadPdf('/data/export/pdf', `plan-crecimiento-${STATE.session.username}.pdf`));
}

async function downloadPdf(path, filename){
  try{
    const token = getToken();
    const res = await fetch(API_BASE + '/api' + path, { headers: { 'Authorization': 'Bearer ' + token } });
    if(!res.ok) throw new Error('No se pudo generar el PDF.');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ STATE.err = e.message; render(); }
}

/* --- cálculo local solo para reflejar la UI al instante; el servidor es la fuente de verdad --- */
function computeAreaScoreLocal(area, planificador, areaKey){
  let score = 0, max = 0;
  max += 30; if(area.meta && area.meta.trim().length>4) score += 30;
  if(area.metricas.length){
    max += 40;
    const avg = area.metricas.reduce((s,m)=>{
      const meta = parseFloat(m.meta)||0, actual = parseFloat(m.actual)||0;
      const pct = meta>0 ? Math.min(1, actual/meta) : 0;
      return s+pct;
    },0) / area.metricas.length;
    score += avg*40;
  } else { max += 40; }
  max += 30;
  const now = Date.now();
  const reciente = planificador.filter(p => p.area===areaKey && (now - new Date(p.fecha).getTime()) <= 7*86400000);
  score += Math.min(1, reciente.length/3) * 30;
  return max>0 ? score/max : 0;
}
function semaforoFromScoreLocal(pct){ if(pct>=0.66) return 'verde'; if(pct>=0.33) return 'amarillo'; return 'rojo'; }
function areaSemaforoLocal(userData, areaKey){ return semaforoFromScoreLocal(computeAreaScoreLocal(userData.areas[areaKey], userData.planificador, areaKey)); }
function stepsCompletedLocal(u){
  let n = 0;
  const ultimo = u.compromisos[u.compromisos.length-1];
  if(ultimo && ultimo.declaracion.trim().length>4) n++;
  if(ultimo && ultimo.publicoCon.trim().length>1) n++;
  if(u.foda.fortalezas.length || u.foda.debilidades.length || u.foda.oportunidades.length || u.foda.amenazas.length) n++;
  if(u.planificador.length>0) n++;
  if(u.bitacora.length>0) n++;
  if(u.compartir.length>0) n++;
  return n;
}

/* ============================= EVENTOS POR VISTA ============================= */
function attachViewEvents(){
  document.querySelectorAll('[data-area]').forEach(el=>el.addEventListener('click', ()=>{
    STATE.areaOpen = el.dataset.area; setView('areas');
  }));

  document.querySelectorAll('.brecha-check').forEach(el=>el.addEventListener('change', ()=>{
    const detalle = document.getElementById('detalle-' + el.dataset.brecha);
    if(detalle) detalle.style.display = el.checked ? 'block' : 'none';
  }));
  const bsBrecha = document.getElementById('btn-save-brecha');
  if(bsBrecha) bsBrecha.addEventListener('click', async ()=>{
    const marcadas = [...document.querySelectorAll('.brecha-check:checked')].map(c=>c.dataset.brecha);
    if(marcadas.length===0){ STATE.err = 'Marca al menos una brecha.'; render(); return; }
    const partirLineas = txt => (txt||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);
    const detalles = marcadas.map(id => ({
      brecha: id,
      causas: partirLineas(document.getElementById('causas-'+id)?.value),
      efectos: partirLineas(document.getElementById('efectos-'+id)?.value)
    }));
    const planAccion = document.getElementById('brecha-plan').value;
    try{
      const res = await api('/data/brecha', { method:'POST', body:{ detalles, planAccion } });
      STATE.userData.brechas = res.brechas;
      STATE.ok = 'Diagnóstico guardado.';
    }catch(e){ STATE.err = e.message; }
    render();
  });
  document.querySelectorAll('[data-delbrecha]').forEach(el=>el.addEventListener('click', async ()=>{
    try{
      const res = await api('/data/brecha/' + el.dataset.delbrecha, { method:'DELETE' });
      STATE.userData.brechas = res.brechas;
    }catch(e){ STATE.err = e.message; }
    render();
  }));
  document.querySelectorAll('[data-addauto]').forEach(el=>el.addEventListener('click', async ()=>{
    const [rutaBase, preguntaId] = el.dataset.addauto.split(':');
    const input = document.getElementById(`auto-${rutaBase}-${preguntaId}`);
    const texto = input.value.trim();
    if(!texto) return;
    const clave = rutaBase==='conciencia' ? 'conciencia' : 'reflexionPersonal';
    try{
      const res = await api(`/data/${rutaBase}/${preguntaId}`, { method:'POST', body:{ texto } });
      STATE.userData[clave] = res[clave];
    }catch(e){ STATE.err = e.message; }
    render();
  }));
  document.querySelectorAll('[data-delauto]').forEach(el=>el.addEventListener('click', async ()=>{
    const [rutaBase, preguntaId, index] = el.dataset.delauto.split(':');
    const clave = rutaBase==='conciencia' ? 'conciencia' : 'reflexionPersonal';
    try{
      const res = await api(`/data/${rutaBase}/${preguntaId}/${index}`, { method:'DELETE' });
      STATE.userData[clave] = res[clave];
    }catch(e){ STATE.err = e.message; }
    render();
  }));
  const bsPerfil = document.getElementById('btn-save-perfil');
  if(bsPerfil) bsPerfil.addEventListener('click', async ()=>{
    const preguntas = catalogoDiagnostico.preguntas;
    const respuestas = [];
    for(const p of preguntas){
      const marcado = document.querySelector(`input[name="perfil-${p.id}"]:checked`);
      if(!marcado){ STATE.err = 'Responde todas las preguntas antes de continuar.'; render(); return; }
      respuestas.push(marcado.value);
    }
    try{
      const res = await api('/data/perfil-crecimiento', { method:'POST', body:{ respuestas } });
      STATE.userData.perfilCrecimiento = res.perfilCrecimiento;
      STATE.ok = '';
    }catch(e){ STATE.err = e.message; }
    render();
  });
  document.querySelectorAll('[data-delperfil]').forEach(el=>el.addEventListener('click', async ()=>{
    try{
      const res = await api('/data/perfil-crecimiento/' + el.dataset.delperfil, { method:'DELETE' });
      STATE.userData.perfilCrecimiento = res.perfilCrecimiento;
    }catch(e){ STATE.err = e.message; }
    render();
  }));

  const bsc = document.getElementById('btn-save-compromiso');
  if(bsc) bsc.addEventListener('click', async ()=>{
    const declaracion = document.getElementById('f-declaracion').value.trim();
    if(!declaracion){ STATE.err='Escribe tu declaración de compromiso.'; render(); return; }
    try{
      const res = await api('/data/compromiso', { method:'POST', body:{
        declaracion,

    }catch(e){ STATE.err = e.message; }
    render();
  });
  document.querySelectorAll('[data-delcompromiso]').forEach(el=>el.addEventListener('click', async ()=>{
    try{
      const res = await api('/data/compromiso/' + el.dataset.delcompromiso, { method:'DELETE' });

  document.querySelectorAll('[data-delshare]').forEach(el=>el.addEventListener('click', async ()=>{
    try{
      const res = await api('/data/compartir/' + el.dataset.delshare, { method:'DELETE' });
      STATE.userData.compartir = res.compartir;
    }catch(e){ STATE.err = e.message; }
    render();
  }));

  document.querySelectorAll('[data-openmentee]').forEach(el=>el.addEventListener('click', ()=>{
    mentorDetailCache = null; STATE.mentorSelected = el.dataset.openmentee; render();
  }));
  const dlGroup = document.getElementById('btn-download-group-pdf');
  if(dlGroup) dlGroup.addEventListener('click', ()=>downloadPdf('/mentor/mentees/export/pdf', 'reporte-grupo-lidera-tu-vida.pdf'));
  const backMentor = document.getElementById('btn-back-mentor');
  if(backMentor) backMentor.addEventListener('click', ()=>{ STATE.mentorSelected=null; mentorDetailCache=null; render(); });
  const dlMentee = document.getElementById('btn-download-mentee-pdf');
  if(dlMentee) dlMentee.addEventListener('click', ()=>downloadPdf(
    '/mentor/mentees/' + encodeURIComponent(STATE.mentorSelected) + '/export/pdf',
    `plan-crecimiento-${STATE.mentorSelected}.pdf`
  ));
  const addParticipante = document.getElementById('btn-add-participante');
  if(addParticipante) addParticipante.addEventListener('click', async ()=>{
    const nombre = document.getElementById('np-nombre').value.trim();
    const email = document.getElementById('np-email').value.trim();
    const username = document.getElementById('np-user').value.trim();
    const rol = document.getElementById('np-rol').value;
    try{
      const res = await api('/mentor/participantes', { method:'POST', body:{ nombre, email, username, rol } });
      ultimaCredencialCreada = res.credenciales;
      STATE.err = '';
      STATE.mentorList = null; // para que la tabla se actualice con el nuevo participante
      render();
    }catch(e){ STATE.err = e.message; render(); }
  });
}

/* ============================= INICIO ============================= */
(async function init(){
  const token = getToken();
  const user = getStoredUser();
  if(token && user){
    try{
      STATE.session = user;
      const res = await api('/data');
      STATE.userData = res.data;
      STATE.view = 'dashboard';
    }catch(e){
      clearSession(); STATE.session=null; STATE.view='auth';
    }
  }
  render();
})();
</script>
</body>
</html>
